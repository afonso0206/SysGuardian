# ============================================
# SysGuardian Configuration
# Version: 7.0.0-alpha1
# ============================================

# Diretórios
CONFIG_DIR="/etc/sysguardian"
DATA_DIR="/usr/share/sysguardian"
REPORT_DIR="/var/log/sysguardian"

# Retenção de relatórios (dias)
LOG_RETENTION_DAYS=30

# Módulos
CHECK_CPU=true
CHECK_MEMORY=true
CHECK_DISKS=true
CHECK_LVM=true
CHECK_SMART=true
CHECK_NETWORK=true
CHECK_SECURITY=true
CHECK_DOCKER=true
CHECK_APACHE=true
CHECK_PHP=true
CHECK_MYSQL=true
CHECK_BACKUP=true
CHECK_TRIM=true

# Formatos de saída
GENERATE_TXT=true
GENERATE_HTML=true
GENERATE_PDF=true

# Pontuação
MIN_SCORE_WARNING=90
MIN_SCORE_CRITICAL=70
