# ==============================================================================
# SysGuardian - Configuração do Módulo audiovisual de Impressoras HP
# ==============================================================================

# Parâmetros Globais de Comunicação SNMP
COMMUNITY=public
VERSION=2c
TIMEOUT=2
RETRIES=1
PORT=161
DISCOVERY=false
LOG_LEVEL=INFO

# Inventário de Impressoras Monitoradas (NOME_IDENTIFICADOR=IP_OU_HOSTNAME)
HP_RECEPCAO=192.168.1.10
HP_FINANCEIRO=192.168.1.20
HP_ADMINISTRACAO=192.168.1.30
